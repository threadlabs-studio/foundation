name: Cross-platform

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: extended-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Corepack owns the pnpm/Yarn shims; --force replaces runner-provided shims in this ephemeral job.
      - run: npm install --global --ignore-scripts --force corepack@0.34.7
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:extended
